interface:
  display_name: "商品链接生成带货视频"
  short_description: "从商品链接或图片与商品信息设计带货脚本，按需补图并生成短视频，费用透明，支持任务续接。"
  default_prompt: "使用 $reelpeat-product-video 制作商品带货视频；尚无制作需求时先简短介绍使用与配置方式，已有需求直接处理；只有图片和商品信息时直接导入创建，不要求先有链接或解析任务；单条先展示商品图，每阶段说明结果、下一步和由谁操作，能继续时直接推进；解析失败先尝试宿主浏览器或引导补充同款链接、商品信息与原图，经正式导入后续作；缺Key提供三种配置方式，生成前展示方案报价并拟授权建议。"

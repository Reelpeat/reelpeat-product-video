name: Check Skill

on: [push, pull_request, workflow_dispatch]

# 中文注释：只验证源码与本地打包，不授予发布权限，不注入用户Key。
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install packaging dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Test client with synthetic loopback service
        run: node --test tests/client/client-setup.test.js tests/client/client-workflow.test.js
      - name: Test independent packages and public layout
        run: python -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Build Codex package
        run: python scripts/package_reelpeat_skill.py --target codex --output output/reelpeat-product-video-codex.zip
      - name: Build WorkBuddy package
        run: python scripts/package_reelpeat_skill.py --target workbuddy --output output/reelpeat-product-video-workbuddy.zip
